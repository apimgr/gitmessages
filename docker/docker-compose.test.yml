name: gitmessages-test

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  gitmessages:
    image: ghcr.io/apimgr/gitmessages:devel
    container_name: gitmessages-app
    hostname: gitmessages
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 8080
      MODE: development
      DEBUG: "true"
      TZ: America/New_York
    tmpfs:
      - /config
      - /data
      - /logs
    ports:
      - "127.0.0.1:64081:8080"
    networks:
      - gitmessages-test

networks:
  gitmessages-test:
    name: gitmessages-test
    external: false
