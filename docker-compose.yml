name: gitmessages

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  gitmessages:
    image: ghcr.io/apimgr/gitmessages:latest
    container_name: gitmessages-app
    hostname: gitmessages
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 8080
      TZ: America/New_York
    volumes:
      - ./volumes/config:/config
      - ./volumes/data:/data
      - ./volumes/logs:/logs
    ports:
      - "172.17.0.1:64580:8080"
    networks:
      - gitmessages

networks:
  gitmessages:
    name: gitmessages
    external: false
